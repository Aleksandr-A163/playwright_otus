plugins {
    id 'java'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.1.7'
}

group = 'ru.otus'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

ext {
    playwrightVersion = '1.53.0'
    junitVersion = '5.12.2'
    guiceVersion = '7.0.0'
    slf4jVersion = '2.0.17'
    checkstyleVersion = '10.21.4'
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation "com.microsoft.playwright:playwright:${playwrightVersion}"
    testImplementation "com.google.inject:guice:${guiceVersion}"
    testImplementation "org.slf4j:slf4j-simple:${slf4jVersion}"

    checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
}

test {
    useJUnitPlatform()

    systemProperty 'headless', System.getProperty('headless', 'true')
    systemProperty 'baseUrl', System.getProperty('baseUrl', 'https://otus.ru/lessons/clickhouse/')
    systemProperty 'browser', System.getProperty('browser', 'chromium')

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

checkstyle {
    toolVersion = checkstyleVersion
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

spotbugs {
    ignoreFailures = false
    effort = com.github.spotbugs.snom.Effort.MAX
    reportLevel = 'LOW'
    excludeFilter = file('config/spotbugs-exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}